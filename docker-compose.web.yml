services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      SEARXNG_URL: http://searxng:8080
      HF_HOME: /data/huggingface
    volumes:
      - huggingface-cache:/data/huggingface
      - vector-data:/app/vector_db_bge_m3
      - analysis-results:/app/results
    depends_on:
      searxng:
        condition: service_healthy

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  huggingface-cache:
  vector-data:
  analysis-results:

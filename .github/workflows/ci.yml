name: CI

on:
  push:
    branches: [debate_focus, master]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    # Windows: desktop tests use msvcrt, tkinter and DPAPI.
    runs-on: windows-latest
    env:
      OPENAI_API_KEY: test-dummy-key
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/test.txt
      - run: python -m pip install -r requirements/test.txt -c requirements/lock-windows.txt
      - run: python -m tests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
